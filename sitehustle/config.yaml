# SiteHustle defaults. Shareable: no personal details here.
# Put YOUR details in config.local.yaml (git-ignored), copied from config.local.example.yaml.
# Keys (Resend, Netlify, Stripe) go in .env, copied from .env.example.

business:
  name: "TODO"                 # studio name (if it isn't your legal name, PA requires a fictitious-name filing)
  sender_name: "TODO"          # your real full name: the person accountable for every email
  sender_email: "TODO"
  reply_to: "TODO"
  phone: "TODO"
  owner_digest_email: "TODO"   # where the daily approval digest goes
  postal_address: "TODO"       # required in every sales email by CAN-SPAM (a registered PO box is fine)
  based_in: ""                 # optional, only if true, e.g. "in Mechanicsburg"
  website: ""

offer:
  price_usd: 500
  hosting_months: 12
  renewal_usd: 120             # optional yearly renewal after the included term; or a free file handover
  stripe_payment_link: "TODO"  # a $500 Stripe Payment Link
  terms_url: "TODO"            # one-page terms + refund policy (have a PA attorney look it over)
  includes:
    - "A mobile-friendly site with your menu, hours, map and tap-to-call"
    - "12 months of hosting, with routine menu, price and hours updates included"
    - "Checking your Google Business Profile hours, phone and website link"
    - "Connecting your own domain if you have one"

targeting:
  areas:
    - name: "Mechanicsburg, PA"
      lat: 40.2140
      lon: -77.0086
      radius_m: 9000
  skip_chains: true
  # Pitch only sites scoring 5 or lower on the 1-10 rubric (RUNBOOK). Never pitch places with a decent site.
  max_design_score_to_pitch: 5
  # The council recommends excluding places that already have a POS / ordering-vendor site
  # (Square, Toast, Slice, order.online) unless the pitch says it complements that site.
  skip_vendor_sites: true

outreach:
  # paused = nothing sends.  manual = only items you approved in a digest send.
  # There is no automatic mode, and any other value sends nothing.
  mode: paused
  daily_send_limit: 5
  followup_after_days: 5
  max_followups: 1
  send_window_hours_local: [9, 16]   # US Eastern, weekdays

hosting:
  provider: netlify
  preview_site_prefix: "previews-"   # one shared, unindexed preview site with unguessable paths
  preview_base_url: ""               # optional: e.g. https://preview.yourstudio.com once you point a domain at it
  preview_ttl_days: 30               # unsold previews come down after this
